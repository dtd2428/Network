<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OSI 1계층 모의고사</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f3f6fb;
    margin: 0;
    padding: 20px;
    color: #222;
}

.container {
    max-width: 850px;
    margin: auto;
}

.header {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    text-align: center;
}

.header h1 {
    color: #2563eb;
    font-size: 26px;
}

.question {
    background: white;
    padding: 22px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 2px solid transparent;
}

.question h3 {
    font-size: 17px;
    line-height: 1.6;
}

.option {
    display: block;
    padding: 12px;
    margin: 7px 0;
    background: #f8fafc;
    border-radius: 8px;
    cursor: pointer;
}

.option:has(input:checked) {
    background: #dbeafe;
    border: 1px solid #2563eb;
}

input[type="radio"] {
    margin-right: 10px;
    transform: scale(1.2);
}

.buttons {
    display: flex;
    gap: 10px;
    margin: 25px 0;
}

button {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#gradeBtn {
    background: #2563eb;
    color: white;
}

#resetBtn {
    background: #64748b;
    color: white;
}

#result {
    display: none;
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 20px;
}

.correct {
    border-color: #22c55e;
}

.wrong {
    border-color: #ef4444;
}

.explanation {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: #eff6ff;
    border-radius: 8px;
    line-height: 1.7;
}

.progress {
    margin-top: 15px;
    font-weight: bold;
    color: #2563eb;
}

@media(max-width: 600px) {
    body {
        padding: 10px;
    }

    .header h1 {
        font-size: 22px;
    }

    .question {
        padding: 17px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>OSI 1계층 모의고사</h1>
        <p>네트워크관리사 2급 필기시험 대비</p>
        <p>총 30문제 · 4지선다형</p>

        <div class="progress" id="progress">
            0 / 30 문제 응답
        </div>
    </div>

    <div id="result"></div>

    <div id="quiz"></div>

    <div class="buttons">
        <button id="gradeBtn" onclick="gradeQuiz()">
            채점하기
        </button>

        <button id="resetBtn" onclick="resetQuiz()">
            다시 풀기
        </button>
    </div>

</div>

<script>

const questions = [

{
q:"OSI 7계층에서 물리 계층의 주요 역할은?",
o:["데이터 암호화","경로 선택","비트를 물리적 신호로 전송","MAC 주소 식별"],
a:2,
e:"물리 계층은 비트를 전기, 광, 무선 신호로 변환하여 전송한다."
},

{
q:"물리 계층의 데이터 전송 단위는?",
o:["프레임","패킷","세그먼트","비트"],
a:3,
e:"1계층의 전송 단위는 비트(Bit)이다."
},

{
q:"다음 중 1계층의 대표 장비는?",
o:["라우터","리피터","브리지","스위치"],
a:1,
e:"리피터와 허브는 대표적인 물리 계층 장비이다."
},

{
q:"리피터의 주요 역할은?",
o:["IP 주소 확인","데이터 암호화","신호 재생 및 전송 거리 연장","MAC 주소 학습"],
a:2,
e:"리피터는 약해진 신호를 재생하여 전송 거리를 연장한다."
},

{
q:"허브의 특징으로 올바른 것은?",
o:["MAC 주소 학습","IP 주소 확인","수신 신호를 다른 포트로 전달","경로 선택"],
a:2,
e:"허브는 MAC 주소를 구분하지 않고 신호를 다른 포트로 전달한다."
},

{
q:"물리 계층에서 해석하지 않는 정보는?",
o:["전기 신호 변화","신호 타이밍","전압 수준","목적지 MAC 주소"],
a:3,
e:"MAC 주소는 2계층에서 사용하는 주소이다."
},

{
q:"물리 계층의 기능이 아닌 것은?",
o:["비트 동기화","신호 인코딩","라우팅 테이블 관리","물리 인터페이스 정의"],
a:2,
e:"라우팅 테이블은 3계층에서 사용한다."
},

{
q:"미디어 컨버터의 주요 역할은?",
o:["전기 신호와 광 신호 변환","IP 주소 할당","경로 선택","데이터 암호화"],
a:0,
e:"미디어 컨버터는 서로 다른 전송 매체 사이에서 신호를 변환한다."
},

{
q:"MAC 주소를 이용해 프레임을 전달하는 장비는?",
o:["리피터","허브","L2 스위치","모뎀"],
a:2,
e:"L2 스위치는 MAC 주소 테이블을 이용하여 프레임을 전달한다."
},

{
q:"물리 계층에서 사용하는 신호가 아닌 것은?",
o:["전기 신호","광 신호","무선 신호","IP 주소"],
a:3,
e:"IP 주소는 3계층에서 사용하는 논리적 주소이다."
},

{
q:"UTP 케이블의 특징은?",
o:["빛으로 전송","별도의 금속 차폐가 없는 꼬임쌍선","동축 케이블","무선 통신"],
a:1,
e:"UTP는 Unshielded Twisted Pair의 약자이다."
},

{
q:"STP에서 S의 의미는?",
o:["Standard","Shielded","Signal","Serial"],
a:1,
e:"STP는 Shielded Twisted Pair를 의미한다."
},

{
q:"광섬유 케이블의 특징이 아닌 것은?",
o:["빛을 이용","전자기 간섭에 강함","장거리 통신에 유리","구리 도체로 전류 전달"],
a:3,
e:"광섬유는 전류가 아니라 빛을 이용한다."
},

{
q:"동축 케이블의 구성 요소가 아닌 것은?",
o:["중심 도체","절연체","차폐망","광섬유 코어"],
a:3,
e:"동축 케이블은 중심 도체, 절연체, 차폐망, 외피 등으로 구성된다."
},

{
q:"버스형 토폴로지에서 터미네이터를 사용하는 이유는?",
o:["IP 충돌 방지","신호 반사 방지","전송 속도 증가","암호화"],
a:1,
e:"터미네이터는 케이블 끝에서 발생하는 신호 반사를 방지한다."
},

{
q:"버스형 동축 이더넷에서 터미네이터 설치 위치는?",
o:["CPU 내부","주 케이블 양 끝","라우터 내부","네트워크 중앙"],
a:1,
e:"터미네이터는 버스형 주 케이블의 양 끝에 설치한다."
},

{
q:"단방향(Simplex) 통신의 특징은?",
o:["동시 양방향","교대로 양방향","한 방향으로만 전송","광섬유 전용"],
a:2,
e:"단방향 통신은 한쪽 방향으로만 데이터를 전송한다."
},

{
q:"반이중(Half Duplex)의 대표적인 예시는?",
o:["무전기","전화 통화","전이중 이더넷","단방향 방송"],
a:0,
e:"무전기는 양방향 통신이 가능하지만 동시에 송신할 수 없다."
},

{
q:"전이중(Full Duplex)의 특징은?",
o:["한 방향만 전송","양방향 동시 송수신","동축 케이블 필수","교대로 송신"],
a:1,
e:"전이중 통신은 동시에 양방향 송수신이 가능하다."
},

{
q:"직렬 전송의 특징은?",
o:["여러 비트를 동시에 전송","비트를 순서대로 전송","무선 전용","신호 없이 전송"],
a:1,
e:"직렬 전송은 비트를 순서대로 전달하는 방식이다."
},

{
q:"10BASE2의 최대 케이블 길이는?",
o:["100m","185m","500m","1000m"],
a:1,
e:"10BASE2는 약 185m까지 전송할 수 있다."
},

{
q:"10BASE5의 최대 케이블 길이는?",
o:["100m","185m","500m","2000m"],
a:2,
e:"10BASE5는 최대 500m의 동축 케이블을 사용한다."
},

{
q:"100BASE-TX의 전송 속도는?",
o:["10Mbps","100Mbps","1Gbps","10Gbps"],
a:1,
e:"100BASE-TX는 100Mbps 이더넷 규격이다."
},

{
q:"1000BASE-T의 전송 속도는?",
o:["10Mbps","100Mbps","1Gbps","10Gbps"],
a:2,
e:"1000BASE-T는 1Gbps 이더넷 규격이다."
},

{
q:"10BASE-T에서 BASE의 의미는?",
o:["Baseband","Basic Ethernet","Binary Address","Broadcast"],
a:0,
e:"BASE는 Baseband(기저대역)를 의미한다."
},

{
q:"신호 감쇠(Attenuation)의 의미는?",
o:["암호화","신호 세기 감소","IP 변경","MAC 중복"],
a:1,
e:"감쇠는 신호가 전송되는 동안 세기가 약해지는 현상이다."
},

{
q:"잡음(Noise)의 의미는?",
o:["원하지 않는 신호","IP 주소","전송 속도","압축 방식"],
a:0,
e:"잡음은 통신 신호에 영향을 주는 불필요한 신호이다."
},

{
q:"bps의 의미는?",
o:["초당 바이트 수","초당 비트 수","초당 오류 수","초당 패킷 수"],
a:1,
e:"bps는 bits per second의 약자이다."
},

{
q:"맨체스터 인코딩의 특징은?",
o:["MAC 주소 분석","비트 중앙의 신호 전이","광섬유 전용","IP 암호화"],
a:1,
e:"맨체스터 인코딩은 비트 중앙의 신호 전이를 이용한다."
},

{
q:"신호를 재생하여 전송 거리를 연장하는 장비는?",
o:["라우터","방화벽","리피터","스위치"],
a:2,
e:"리피터는 신호를 재생하여 전송 거리를 연장한다."
}

];

const quiz = document.getElementById("quiz");

function renderQuiz() {

    quiz.innerHTML = "";

    questions.forEach((question, index) => {

        const div = document.createElement("div");

        div.className = "question";
        div.id = "question" + index;

        let html = `<h3>${index + 1}. ${question.q}</h3>`;

        question.o.forEach((option, i) => {

            html += `
                <label class="option">
                    <input type="radio"
                           name="q${index}"
                           value="${i}"
                           onchange="updateProgress()">
                    ${["①","②","③","④"][i]} ${option}
                </label>
            `;

        });

        html += `
            <div class="explanation" id="ex${index}">
                <strong>정답: ${["①","②","③","④"][question.a]}
                ${question.o[question.a]}</strong>
                <br><br>
                ${question.e}
            </div>
        `;

        div.innerHTML = html;

        quiz.appendChild(div);

    });

}

function updateProgress() {

    let answered = 0;

    questions.forEach((q, index) => {

        if(document.querySelector(
            `input[name="q${index}"]:checked`
        )) {
            answered++;
        }

    });

    document.getElementById("progress").innerText =
        `${answered} / ${questions.length} 문제 응답`;

}

function gradeQuiz() {

    let correct = 0;

    questions.forEach((question, index) => {

        const selected = document.querySelector(
            `input[name="q${index}"]:checked`
        );

        const div = document.getElementById("question" + index);

        const explanation = document.getElementById("ex" + index);

        div.classList.remove("correct", "wrong");

        if(selected && Number(selected.value) === question.a) {

            correct++;

            div.classList.add("correct");

        } else {

            div.classList.add("wrong");

        }

        explanation.style.display = "block";

    });

    const score = (correct / questions.length * 100).toFixed(1);

    const result = document.getElementById("result");

    result.style.display = "block";

    result.innerHTML = `
        <h2>시험 결과</h2>
        <h1>${score}점</h1>
        <p>정답: ${correct} / ${questions.length}</p>
        <p>오답 및 미응답: ${questions.length - correct}개</p>
        <p>아래에서 문제별 정답과 해설을 확인하세요.</p>
    `;

    result.scrollIntoView({
        behavior: "smooth"
    });

}

function resetQuiz() {

    renderQuiz();

    document.getElementById("result").style.display = "none";

    updateProgress();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

renderQuiz();

</script>

</body>
</html>
